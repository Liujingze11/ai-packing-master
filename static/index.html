<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能包装推荐助手</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    #app {
      width: 100%;
      max-width: 800px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }
    
    header {
      background: linear-gradient(90deg, #2c3e50 0%, #4a6491 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }
    
    header h1 {
      font-size: 24px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    
    header h1 i {
      font-size: 28px;
    }
    
    header p {
      font-size: 14px;
      opacity: 0.8;
    }
    
    #chat-container {
      padding: 20px;
      height: 500px;
      display: flex;
      flex-direction: column;
    }
    
    #history {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      background: #f9fbfd;
      border-radius: 10px;
      margin-bottom: 15px;
      border: 1px solid #e1e8ed;
    }
    
    .message {
      margin-bottom: 15px;
      padding: 12px 15px;
      border-radius: 12px;
      line-height: 1.5;
      max-width: 85%;
      position: relative;
      animation: fadeIn 0.3s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .user {
      background: #d1e7ff;
      color: #0d47a1;
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }
    
    .assistant {
      background: #e1f3e6;
      color: #1b5e20;
      margin-right: auto;
      border-bottom-left-radius: 4px;
    }
    
    .message-header {
      display: flex;
      align-items: center;
      font-weight: bold;
      margin-bottom: 5px;
    }
    
    .message-content {
      white-space: pre-wrap;
    }
    
    #input-container {
      display: flex;
      gap: 10px;
    }
    
    #input {
      flex: 1;
      padding: 12px 15px;
      border: 1px solid #d1dbe5;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s;
    }
    
    #input:focus {
      border-color: #4a6491;
      box-shadow: 0 0 0 2px rgba(74, 100, 145, 0.2);
    }
    
    #send-btn {
      background: linear-gradient(90deg, #4a6491 0%, #2c3e50 100%);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0 25px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    #send-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    
    #send-btn:active {
      transform: translateY(0);
    }
    
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(74, 100, 145, 0.3);
      border-radius: 50%;
      border-top-color: #4a6491;
      animation: spin 1s ease-in-out infinite;
      margin-right: 10px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .example {
      font-size: 14px;
      color: #666;
      margin-top: 10px;
      text-align: center;
    }
    
    footer {
      text-align: center;
      padding: 15px;
      font-size: 12px;
      color: #777;
      border-top: 1px solid #eee;
    }
    
    @media (max-width: 600px) {
      #app {
        border-radius: 12px;
      }
      
      header {
        padding: 15px;
      }
      
      header h1 {
        font-size: 20px;
      }
      
      #chat-container {
        padding: 15px;
        height: 400px;
      }
      
      .message {
        max-width: 90%;
      }
      
      #input {
        padding: 10px 12px;
      }
      
      #send-btn {
        padding: 0 20px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1><i>📦</i> 智能包装推荐助手</h1>
      <p>输入零件编号和数量，获取最优包装方案</p>
    </header>
    
    <div id="chat-container">
      <div id="history"></div>
      
      <div id="input-container">
        <input type="text" id="input" placeholder="请输入零件编号和数量，例如：A001 10">
        <button id="send-btn">发送</button>
      </div>
      
      <div class="example">示例：A001 10、B205 50、C307 100</div>
    </div>
    
    <footer>
      <p>包装优化系统 © 2023 | 确保主服务(5000)和工具服务(5001)均已启动</p>
    </footer>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const historyDiv = document.getElementById('history');
      const input = document.getElementById('input');
      const sendBtn = document.getElementById('send-btn');
      
      // 初始消息
      addMessage('assistant', '🤖 你好！我是智能包装推荐助手\n\n请告诉我零件编号和数量，例如："A001 10"，我将为您推荐最优包装方案');
      
      // 发送按钮点击事件
      sendBtn.addEventListener('click', sendMessage);
      
      // 输入框回车事件
      input.addEventListener('keyup', (event) => {
        if (event.key === 'Enter') {
          sendMessage();
        }
      });
      
      // 添加消息函数
      function addMessage(role, content) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${role}`;
        
        const headerDiv = document.createElement('div');
        headerDiv.className = 'message-header';
        headerDiv.innerHTML = role === 'user' ? '👤 用户' : '🤖 助手';
        
        const contentDiv = document.createElement('div');
        contentDiv.className = 'message-content';
        contentDiv.innerHTML = content.replace(/\n/g, '<br>');
        
        messageDiv.appendChild(headerDiv);
        messageDiv.appendChild(contentDiv);
        historyDiv.appendChild(messageDiv);
        
        // 滚动到底部
        historyDiv.scrollTop = historyDiv.scrollHeight;
      }
      
      // 发送消息函数
      async function sendMessage() {
        const message = input.value.trim();
        if (!message) return;
        
        // 添加用户消息
        addMessage('user', message);
        input.value = '';
        input.disabled = true;
        sendBtn.disabled = true;
        
        // 添加加载状态
        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'message assistant';
        loadingDiv.innerHTML = `
          <div class="message-header">🤖 助手</div>
          <div class="message-content">
            <div class="loading"></div> 正在计算最佳包装方案...
          </div>
        `;
        historyDiv.appendChild(loadingDiv);
        historyDiv.scrollTop = historyDiv.scrollHeight;
        
        try {
          // 发送请求到后端
          const response = await fetch('/recommend', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ message })
          });
          
          if (!response.ok) {
            throw new Error(`请求失败: ${response.status}`);
          }
          
          const data = await response.json();
          
          // 移除加载状态
          historyDiv.removeChild(loadingDiv);
          
          // 添加助手回复
          addMessage('assistant', data.response);
          
        } catch (error) {
          console.error('请求出错:', error);
          
          // 移除加载状态
          historyDiv.removeChild(loadingDiv);
          
          // 显示错误信息
          addMessage('assistant', `❌ 请求失败: ${error.message || '未知错误'}\n\n请检查：\n1. 后端服务是否运行\n2. 网络连接是否正常\n3. 输入格式是否正确`);
        } finally {
          input.disabled = false;
          sendBtn.disabled = false;
          input.focus();
        }
      }
    });
  </script>
</body>
</html>
